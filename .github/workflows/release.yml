name: release

run-name: validation release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Bundle version for unsigned validation artifacts
        required: true
        default: 0.1.0-dev

env:
  RELEASE_VERSION: ${{ inputs.version }}

permissions:
  contents: read

jobs:
  build-linux:
    name: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version: ">=1.22.0"
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - name: Build libwg
        run: cd libwg && ./build.sh
      - name: Set package version
        run: node apps/desktop/scripts/set-release-version.mjs "$RELEASE_VERSION"
      - name: Build Debian package
        run: |
          npm --prefix apps/desktop ci
          npm --prefix apps/desktop run tauri -- build
      - uses: actions/upload-artifact@v7
        with:
          name: feilian-lite-linux
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: build-macos
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version: ">=1.22.0"
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build libwg
        run: cd libwg && ./build.sh
      - name: Set package version
        run: node apps/desktop/scripts/set-release-version.mjs "$RELEASE_VERSION"
      - name: Build macOS bundles
        run: |
          npm --prefix apps/desktop ci
          npm --prefix apps/desktop run tauri -- build
      - uses: actions/upload-artifact@v7
        with:
          name: feilian-lite-macos
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version: ">=1.22.0"
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: make mingw-w64-x86_64-gcc
          path-type: inherit
      - name: Expose MinGW runtime
        shell: pwsh
        run: '"${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Configure Rust GNU toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-gnu
          rustup default stable-x86_64-pc-windows-gnu
      - name: Build libwg
        shell: msys2 {0}
        run: cd libwg/wireguard-go && make libwg && mv libwg.* ..
      - name: Set package version
        shell: pwsh
        run: node apps/desktop/scripts/set-release-version.mjs $env:RELEASE_VERSION
      - name: Build Windows bundles
        run: |
          npm --prefix apps/desktop ci
          npm --prefix apps/desktop run tauri -- build --target x86_64-pc-windows-gnu
      - uses: actions/upload-artifact@v7
        with:
          name: feilian-lite-windows
          path: |
            target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-gnu/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
